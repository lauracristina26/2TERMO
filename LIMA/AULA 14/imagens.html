<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Vídeos</title>
</head>
<body>
    <h1>Trabalhando com Imagens</h1>
    <h2>Imagem responsiva básica</h2>
        <figure class="resp-bas">
            <img src="https://i.pinimg.com/736x/75/53/04/755304fb24b1b8c71719a8bd44689eae.jpg" alt="Imagem 1">
        </figure>

        <h2>Imagem com Recorte</h2>
        <figure class="img-rec">
            <img src="https://i.pinimg.com/736x/da/b9/5c/dab95c872094c64a220b1e7414c68c5e.jpg" alt="Imagem 2">
        </figure>

        <h2>Imagens em formato de cards</h2>
        <figure class="img-card">
            <img src="https://i.pinimg.com/736x/ee/09/0b/ee090b59831d8495023ca8af35fdcd21.jpg" alt="Imagem 3">
        </figure>

        <h2>Personalização</h2>
        <figure class="pers-img">
            <img src="https://i.pinimg.com/736x/ec/73/36/ec7336a04460e1404f469aff18a4e1ac.jpg" alt="Imagem 4">
        </figure>

        <h2>Imagens em Grid</h2>
        <section class="sec-grid">
            <article class="img-grid">
                <img src="https://i.pinimg.com/1200x/1e/28/09/1e28095428b7cd5d44ac2c801a68afe3.jpg" alt="Imagem 5">
            </article>
            <article class="img-grid">
                <img src="https://i.pinimg.com/736x/44/17/0d/44170d3204cb85d2cff55429af617f7d.jpg" alt="Imagem 6">
            </article>
            <article class="img-grid">
                <img src="https://i.pinimg.com/736x/25/1d/ad/251dad2bccc6f1430d5442e66cce5f36.jpg" alt="Imagem 7">
            </article>
        </section>

        <section class="video">
            <h2>Trailer do Filme</h2>
            <iframe class="video-bd " width="560" height="315" src="https://www.youtube.com/embed/lYXtL5TreOE?si=jqevjFvavFgcl3B6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
</body>
</html>
