<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS - Grid</title>
</head>
<body>
    <header>
        <nav>
            <ul class="grid-ex1">
                <li>
                    <article>
                        Exemplo 1 
                    </article>
                </li>
                <li>
                    <article>
                        Exemplo 2
                    </article>
                </li>
                <li>
                    <article>
                        Exemplo 3
                    </article>
                </li>
            </ul>
        </nav>
    </header>

    <section class="grid-gal">
        <header>
            <h2>Nosso Conteúdo</h2>
        </header>
        <ul class="grid-gal-img">
            <li>
                <figure>
                    <img src="https://i.pinimg.com/736x/b9/db/7f/b9db7fd5bb9c8735cae9e3afea953094.jpg" alt="Imagem exemplo 1">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://i.pinimg.com/736x/e9/8f/42/e98f42c8c98b5f0d4134030db9d51710.jpg" alt="Imagem exemplo 2">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://i.pinimg.com/736x/a1/3d/28/a13d28d6d5ef29fcc0e73af8820606e4.jpg" alt="Imagem exemplo 3">
                </figure>
            </li>
            <li>
                <figure>
                    <img src="https://i.pinimg.com/736x/5a/46/bf/5a46bfc5abaf3cb71884682278856431.jpg" alt="Imagem exemplo 4">
                </figure>
            </li>
        </ul>
    </section>

    <section>
        <header>
            <ul class="flex-grid">
                <li>
                    <article>
                        Flex 1
                    </article>
                </li>
                <li>
                    <article>
                        Flex 2
                    </article>
                </li>
                <li>
                    <article>
                        Flex 3
                    </article>
                </li>
            </ul>
        </header>
    </section>

    <section>
        <ul class="lab-grid">
            <!-- li{$}*6 Inserir lista numerada automática -->
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
        </ul>
    </section>
    
</body>
</html>
